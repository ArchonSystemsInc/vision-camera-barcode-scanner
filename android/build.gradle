buildscript {
  repositories { google(); mavenCentral() }
  dependencies {
    classpath "com.android.tools.build:gradle:8.9.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21"
  }
}
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: "../nitrogen/generated/android/ArchonBarcodeScanner+autolinking.gradle"

def extValue(name) { rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ArchonBarcodeScanner_" + name] }

android {
  namespace "com.margelo.nitro.archon.barcodescanner"
  compileSdkVersion extValue("compileSdkVersion").toInteger()
  ndkVersion extValue("ndkVersion")
  defaultConfig {
    minSdkVersion extValue("minSdkVersion").toInteger()
    targetSdkVersion extValue("targetSdkVersion").toInteger()
    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters(*(rootProject.findProperty("reactNativeArchitectures") ?: "arm64-v8a,armeabi-v7a,x86,x86_64").split(","))
      }
    }
  }
  externalNativeBuild { cmake { path "CMakeLists.txt" } }
  buildFeatures { prefab true }
  packagingOptions {
    excludes = ["META-INF/**", "**/libc++_shared.so", "**/libNitroModules.so", "**/libfbjni.so", "**/libjsi.so", "**/libreactnative.so"]
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}
repositories { google(); mavenCentral() }
dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.camera:camera-core:1.7.0-alpha03"
  // Same bundled model and options as the V5 reference scanner.
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
  implementation project(":react-native-nitro-modules")
  implementation project(":react-native-vision-camera")
}
